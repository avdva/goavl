name: Go

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GOEXPERIMENT: arenas
  GO_VERSION: stable

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
