name: Go

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GOEXPERIMENT: arenas
  GO_VERSION: stable

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
